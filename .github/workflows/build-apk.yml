name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract AI Studio ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          echo "ZIP found: $ZIP_FILE"
          test -n "$ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Locate Gradle project
        run: |
          set -e
          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)
          echo "Gradle wrapper: $GRADLEW"
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find APK
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)
          echo "APK found: $APK"
          test -n "$APK"
          mkdir -p build-output
          cp "$APK" build-output/Arrow-Escape-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-3D-APK
          path: build-output/Arrow-Escape-3D.apk
          
