name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Arrow Escape 3D
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find and Extract AI Studio ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AI Studio ZIP was not found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          echo "ZIP extracted successfully."

      - name: Locate Android Gradle Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "Searching for project files..."
            find project -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore is ready."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Android APK build..."

          gradle assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            echo "Searching for APK files..."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          mkdir -p build-output

          cp "$APK" build-output/Arrow-Escape-3D.apk

          echo "APK ready: build-output/Arrow-Escape-3D.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-3D-APK
          path: build-output/Arrow-Escape-3D.apk
          if-no-files-found: error
          retention-days: 7
          
